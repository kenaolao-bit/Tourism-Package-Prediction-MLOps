
name: Tourism Project Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:

  # ============================================================
  # JOB 1: REGISTER DATASET
  # ============================================================

  register-dataset:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tourism_project/deployment/requirements.txt

      # >>> COMPLEMENT
      # Recreate the project path expected by the Python scripts.
      - name: Configure Project Path
        run: |
          sudo mkdir -p /content
          sudo ln -sfn "$GITHUB_WORKSPACE/tourism_project" /content/tourism_project
      # <<< FIN COMPLEMENT

      - name: Register Dataset
        run: python tourism_project/model_building/data_register.py

      - name: Verify Registered Dataset
        run: |
          test -f tourism_project/data/tourism.csv
          echo "Registered dataset found."

      - name: Upload Registered Dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data/tourism.csv
          if-no-files-found: error

  # ============================================================
  # JOB 2: DATA PREPARATION
  # ============================================================

  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tourism_project/deployment/requirements.txt

      # >>> COMPLEMENT
      # Each GitHub Actions job runs in an independent environment.
      - name: Configure Project Path
        run: |
          sudo mkdir -p /content
          sudo ln -sfn "$GITHUB_WORKSPACE/tourism_project" /content/tourism_project
      # <<< FIN COMPLEMENT

      - name: Download Registered Dataset
        uses: actions/download-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data

      - name: Run Data Preparation
        working-directory: tourism_project
        run: python model_building/prep.py

      - name: Verify Train Test Splits
        working-directory: tourism_project
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          files = ["Xtrain.csv", "Xtest.csv", "ytrain.csv", "ytest.csv"]

          for filename in files:
              path = Path(filename)
              if not path.exists():
                  raise FileNotFoundError(f"Missing file: {path}")
              print(f"{filename}: {path.stat().st_size} bytes")

          Xtrain = pd.read_csv("Xtrain.csv")
          Xtest = pd.read_csv("Xtest.csv")

          assert list(Xtrain.columns) == list(Xtest.columns), \
              "Training and test feature columns do not match."

          print("Training rows:", len(Xtrain))
          print("Testing rows:", len(Xtest))
          print("Features:", len(Xtrain.columns))
          PY

      - name: Upload Train Test Splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            tourism_project/Xtrain.csv
            tourism_project/Xtest.csv
            tourism_project/ytrain.csv
            tourism_project/ytest.csv
          if-no-files-found: error

  # ============================================================
  # JOB 3: MODEL TRAINING
  # ============================================================

  model-training:
    needs: data-prep
    runs-on: ubuntu-latest

    env:
      MLFLOW_TRACKING_URI: http://127.0.0.1:5000

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tourism_project/deployment/requirements.txt

      # >>> COMPLEMENT
      # Pin compatible versions to avoid the SQLAlchemy 2.1
      # FallbackAsyncAdaptedQueuePool import error.
      - name: Install Compatible MLflow Dependencies
        run: |
          python -m pip install "mlflow==3.0.1" "SQLAlchemy>=2.0,<2.1"

      - name: Verify MLflow Dependencies
        run: |
          python - <<'PY'
          import mlflow
          import sqlalchemy

          print("MLflow version:", mlflow.__version__)
          print("SQLAlchemy version:", sqlalchemy.__version__)

          assert mlflow.__version__ == "3.0.1"
          assert sqlalchemy.__version__.startswith("2.0.")

          from sqlalchemy.pool import FallbackAsyncAdaptedQueuePool

          print("SQLAlchemy compatibility check: PASS")
          PY
      # <<< FIN COMPLEMENT

      - name: Download Train Test Splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits
          path: tourism_project

      - name: Verify Downloaded Splits
        working-directory: tourism_project
        run: |
          python - <<'PY'
          from pathlib import Path

          files = ["Xtrain.csv", "Xtest.csv", "ytrain.csv", "ytest.csv"]

          for filename in files:
              if not Path(filename).exists():
                  raise FileNotFoundError(f"Missing training artifact: {filename}")

          print("All training artifacts are present.")
          PY

      # >>> COMPLEMENT
      # Prepare local MLflow tracking directories.
      - name: Prepare MLflow Directories
        working-directory: tourism_project
        run: |
          mkdir -p mlruns
          rm -f mlflow.log mlflow.pid
      # <<< FIN COMPLEMENT

      - name: Start MLflow Server
        working-directory: tourism_project
        run: |
          nohup python -m mlflow server \
            --host 127.0.0.1 \
            --port 5000 \
            --backend-store-uri sqlite:///mlflow.db \
            --default-artifact-root ./mlruns \
            > mlflow.log 2>&1 &

          echo $! > mlflow.pid
          sleep 5

      # >>> COMPLEMENT
      # Wait for MLflow to become available and show diagnostics on failure.
      - name: Verify MLflow Server
        working-directory: tourism_project
        run: |
          python - <<'PY'
          import time
          import urllib.request

          url = "http://127.0.0.1:5000/health"

          for attempt in range(20):
              try:
                  response = urllib.request.urlopen(url, timeout=5)
                  print("MLflow server is responding.")
                  print("HTTP status:", response.status)
                  break
              except Exception as error:
                  print(f"Attempt {attempt + 1}/20: {error}")
                  time.sleep(3)
          else:
              print("MLflow server failed to start.")
              print("\nMLflow server logs:")

              try:
                  with open("mlflow.log", encoding="utf-8") as file:
                      print(file.read())
              except FileNotFoundError:
                  print("mlflow.log was not created.")

              raise SystemExit(1)
          PY
      # <<< FIN COMPLEMENT

      - name: Model Building
        working-directory: tourism_project
        run: python model_building/train.py

      - name: Verify Trained Model
        run: |
          test -f tourism_project/deployment/model.pkl
          echo "Trained model successfully generated."

      - name: Commit Trained Model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add tourism_project/deployment/model.pkl

          git commit -m "Add trained model [skip ci]" || \
            echo "No changes to commit"

          git push
