
name: Tourism Project Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:

  # ============================================================
  # JOB 1: REGISTER DATASET
  # ============================================================

  register-dataset:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install -r tourism_project/deployment/requirements.txt

      # >>> COMPLEMENT
      # Make the Colab project path available on the GitHub runner.
      - name: Configure Project Path
        run: |
          sudo mkdir -p /content
          sudo ln -sfn "$GITHUB_WORKSPACE/tourism_project" /content/tourism_project
      # <<< FIN COMPLEMENT

      - name: Register Dataset
        run: python tourism_project/model_building/data_register.py

      - name: Upload Registered Dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data/tourism.csv

  # ============================================================
  # JOB 2: DATA PREPARATION
  # ============================================================

  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install -r tourism_project/deployment/requirements.txt

      # >>> COMPLEMENT
      # Restore the project path in this independent job.
      - name: Configure Project Path
        run: |
          sudo mkdir -p /content
          sudo ln -sfn "$GITHUB_WORKSPACE/tourism_project" /content/tourism_project
      # <<< FIN COMPLEMENT

      - name: Download Registered Dataset
        uses: actions/download-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data

      - name: Run Data Preparation
        working-directory: tourism_project
        run: python model_building/prep.py

      - name: Upload Train Test Splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            tourism_project/Xtrain.csv
            tourism_project/Xtest.csv
            tourism_project/ytrain.csv
            tourism_project/ytest.csv

  # ============================================================
  # JOB 3: MODEL TRAINING
  # ============================================================

  model-training:
    needs: data-prep
    runs-on: ubuntu-latest

    env:
      MLFLOW_TRACKING_URI: http://127.0.0.1:5000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install -r tourism_project/deployment/requirements.txt

      - name: Download Train Test Splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits
          path: tourism_project

      # >>> COMPLEMENT
      # Start a local MLflow tracking server for this job.
      - name: Start MLflow Server
        working-directory: tourism_project
        run: |
          nohup mlflow server \
            --host 127.0.0.1 \
            --port 5000 \
            --backend-store-uri sqlite:///mlflow.db \
            --default-artifact-root ./mlruns \
            > mlflow.log 2>&1 &

          echo $! > mlflow.pid
          sleep 10

      # Verify server availability and display logs if startup fails.
      - name: Verify MLflow Server
        working-directory: tourism_project
        run: |
          python - <<'PY'
          import time
          import urllib.request

          url = "http://127.0.0.1:5000/health"

          for attempt in range(10):
              try:
                  response = urllib.request.urlopen(url, timeout=5)
                  print("MLflow server is responding.")
                  print("HTTP status:", response.status)
                  break
              except Exception as error:
                  print(f"Attempt {attempt + 1}/10: {error}")
                  time.sleep(3)
          else:
              print("MLflow server failed to start.")
              print("MLflow server logs:")

              try:
                  with open("mlflow.log", encoding="utf-8") as file:
                      print(file.read())
              except FileNotFoundError:
                  print("mlflow.log was not created.")

              raise SystemExit(1)
          PY
      # <<< FIN COMPLEMENT

      - name: Model Building
        working-directory: tourism_project
        run: python model_building/train.py

      - name: Commit Trained Model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tourism_project/deployment/model.pkl
          git commit -m "Add trained model [skip ci]" || echo "No changes to commit"
          git push
